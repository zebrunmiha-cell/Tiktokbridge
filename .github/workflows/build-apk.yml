name: Build TikTok Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract source
        run: |
          mkdir extracted
          unzip -q TikTokBridge_SourceOnly.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Collect APK
        run: |
          mkdir -p apk-output
          find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -exec cp {} apk-output/ \;

          if [ -z "$(ls -A apk-output)" ]; then
            echo "APK not found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokBridge-APK
          path: apk-output/*.apk
          if-no-files-found: error
